version: 2

sources:
  - name: raw
    description: Daily CSV files loaded by load_raw.py.
    tables:
      - name: orders
        description: One row per CSV record, with source columns stored as text.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
